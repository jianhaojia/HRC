# Liquibase 数据库连接配置
# 注意: 生产环境请使用环境变量或密钥管理,不要明文密码

# 数据库 URL
liquibase.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:etl_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 数据库用户名
liquibase.username=${DB_USER:liquibase}

# 数据库密码 (建议使用 --parameter 参数传递或环境变量)
# liquibase.password=${DB_PASSWORD:}

# Driver 类名
liquibase.driver=com.mysql.cj.jdbc.Driver

# ChangeLog 入口文件
changeLogFile=master.xml

# 默认 schema
defaultSchemaName=etl_db

# 输出格式 (tables, json, yaml, txt)
outputFormat=txt

# Contexts (用于区分不同环境)
# 使用方式: mvn liquibase:update -Dliquibase.contexts=uat,prd
